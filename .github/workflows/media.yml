name: Sync media

# Copies catalog images into public/media so Vercel serves them as static files.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [database/media-map.json, scripts/fetch_media.py]

permissions:
  contents: write

concurrency:
  group: media
  cancel-in-progress: true

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/fetch_media.py
      - name: Commit images
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media
          git diff --cached --quiet || (git commit -m "Sync catalog images into public/media" && git pull --rebase origin main && git push)
